name: Build self-hosted Sol Heredit Trainer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sol-trainer.yml"
      - "sol-trainer-source/**"
  workflow_dispatch:

concurrency:
  group: sol-trainer-build-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out editable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the simulator and its OSRS cache assets
        working-directory: sol-trainer-source
        env:
          OSRS_SDK_REPO: https://github.com/OldSchoolSDK/osrs-sdk.git
          OSRS_SDK_BRANCH: feat/cache-render-bundle
          OSRS_CACHE_READER_REPO: https://github.com/Supalosa/osrscachereader.git
          OSRS_CACHE_READER_BRANCH: beta
          OSRS_ASSET_BASE_URL: https://assets-soltrainer.netlify.app
          NETLIFY_CACHE_DIR: /tmp/sol-trainer-build-cache
          COMMIT_REF: x0xp-local
          BUILD_DATE: "2026-11-09"
          DEPLOY_URL: https://x0xp.github.io/sol-trainer/
        run: |
          set -euo pipefail
          bash scripts/build-beta.sh
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/osrs-assets/manifest.json
          if [[ -n "$(find dist -type f -size +90M -print -quit)" ]]; then
            echo "::error::An asset exceeds GitHub's 100 MB file limit."
            exit 1
          fi
          bytes="$(du -sb dist | cut -f1)"
          if [[ "$bytes" -gt 400000000 ]]; then
            echo "::error::Build exceeds the safe repository size limit."
            exit 1
          fi
          echo "Build output: $bytes bytes"

      - name: Upload the build for publishing
        uses: actions/upload-artifact@v4
        with:
          name: sol-heredit-static-site
          path: sol-trainer-source/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out x0XP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tested simulator build
        uses: actions/download-artifact@v4
        with:
          name: sol-heredit-static-site
          path: sol-trainer/

      - name: Publish only when both branches match
        shell: bash
        run: |
          set -euo pipefail
          initial="$(git rev-parse HEAD)"
          git fetch origin main local-development
          if [[ "$(git rev-parse origin/main)" != "$initial" ||
                "$(git rev-parse origin/local-development)" != "$initial" ]]; then
            echo "::error::Branches have moved or diverged. Refusing to overwrite changes."
            exit 1
          fi
          test -s sol-trainer/index.html
          test -s sol-trainer/main.js
          test -s sol-trainer/osrs-assets/manifest.json
          git add -f sol-trainer/
          if git diff --cached --quiet; then
            echo "Static trainer build is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish self-hosted Sol Heredit Trainer"
          git push origin HEAD:refs/heads/main
          git push origin HEAD:refs/heads/local-development
