name: Import editable Sol Heredit Trainer source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-sol-trainer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-trainer-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out x0XP website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import pinned upstream source once, preserving local edits
        shell: bash
        env:
          SOURCE_REPO: https://github.com/Supalosa/ColosseumTrainer.git
          SOURCE_COMMIT: b53022c72b91827becb3ba75d2961adce3e0bd3c
          TARGET_DIR: sol-trainer-source
        run: |
          set -euo pipefail
          if [[ -f "$TARGET_DIR/package.json" ]]; then
            echo "An editable trainer source already exists. Refusing to overwrite modifications."
            exit 0
          fi

          # Keep both working branches at the same source revision.
          base="$(git rev-parse HEAD)"
          git fetch origin local-development
          if [[ "$(git rev-parse origin/local-development)" != "$base" ]]; then
            echo "::error::local-development differs from main. Do not overwrite either branch."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --quiet --no-checkout --depth 1 --branch colosseum "$SOURCE_REPO" "$tmp/trainer"
          if ! git -C "$tmp/trainer" cat-file -e "$SOURCE_COMMIT^{commit}" 2>/dev/null; then
            git -C "$tmp/trainer" fetch --quiet --depth 1 origin "$SOURCE_COMMIT"
          fi
          git -C "$tmp/trainer" checkout --quiet --detach "$SOURCE_COMMIT"
          actual="$(git -C "$tmp/trainer" rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT"

          mkdir -p "$TARGET_DIR"
          # Copy the entire repository's editable files, including binary
          # sounds/images and the original GPL licence, but never its .git.
          tar -C "$tmp/trainer" --exclude="./.git" -cf - . | tar -C "$TARGET_DIR" -xf -
          test -f "$TARGET_DIR/LICENSE"
          test -f "$TARGET_DIR/package.json"
          test -f "$TARGET_DIR/src/ColosseumApp.tsx"

          git add -f "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: import editable Sol Heredit Trainer source"
          git push origin HEAD:refs/heads/main
          git push origin HEAD:refs/heads/local-development
