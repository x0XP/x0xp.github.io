name: Shared UI structure checks

on:
  push:
    branches:
      - refactor/ui-controls
  pull_request:
    paths:
      - "components.css"
      - "index.html"
      - "hub.js"
      - "ui/**"
      - "tests/**"
      - "features/**"
      - "hub.css"
      - "script.js"
      - "price-history.js"
      - ".github/workflows/ui-structure.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run UI structure regression checks
        run: |
          node --test tests/ui-structure.test.cjs tests/feature-css.test.cjs tests/checker-modules.test.cjs
          for file in script.js features/checker/*.js; do node --check "$file"; done

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out main for visual comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-site
      - name: Install headless browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24 pngjs@7
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Test homepage, search, Updates and floating windows
        run: node --test tests/browser-smoke.test.cjs
      - name: Compare desktop and mobile views with main
        run: node --test tests/visual-parity.test.cjs
